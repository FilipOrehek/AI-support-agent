services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.4
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Prague
      - TZ=Europe/Prague
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - mock-crm
  mock-crm:
    image: python:3.12.12-alpine3.22
    working_dir: /app
    command: ["python", "server.py"]
    volumes:
      - ./mock-crm:/app:ro
      - crm_data:/data
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  n8n_data:
  crm_data:
